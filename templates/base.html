<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LinkLite{% endblock %} · URL Shortener</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">↗</span> LinkLite</a>
    <nav><a href="{{ url_for('index') }}">Links</a><a href="{{ url_for('analytics') }}">Analytics</a><a
        href="{{ url_for('export_csv') }}">Export CSV</a></nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}<div class="flash-stack">{% for category, message in messages %}<div class="flash {{ category }}">
        {{ message }}</div>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
    <footer>LinkLite · EF101-P06 · Local demonstration project</footer>
  </main>
</body>

</html>
